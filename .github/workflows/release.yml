name: Release

# Push a tag like v0.3.0 (after updating CHANGELOG.md) to build and publish the desktop apps,
# or run manually from the Actions tab. Publishes windows-<version> and macos-<version> and
# rolls the matching *-latest releases. Android is built locally (needs the signing keystore).
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.3.0"
        required: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        shell: bash
        working-directory: PhoneMic-Desktop
        run: |
          export APP_VERSION="${VERSION#v}"
          cmd //c build-exe.bat
      - name: Publish
        shell: bash
        run: .github/publish.sh windows "$VERSION" windows-release/PhoneMic-Desktop-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        working-directory: PhoneMic-Desktop
        run: |
          # jpackage on macOS rejects a 0.x major: 0.X.Y ships as 1.X.Y
          v="${VERSION#v}"
          APP_VERSION="1.${v#*.}" ./build-dmg.sh
      - name: Publish
        run: .github/publish.sh macos "$VERSION" macos-release/PhoneMic-Desktop-macos.dmg
